name: QA

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Install dependencies
        # Repo currently does not include pnpm-lock.yaml, and pnpm defaults to
        # frozen installs on CI. Allow lockfile generation for now.
        run: pnpm install --no-frozen-lockfile

      - name: QA (full gate)
        run: |
          set -euo pipefail

          pnpm check:deploy
          pnpm check:deploy:imports

          pnpm -C packages/engine test
          pnpm -C packages/replay test
          pnpm -C apps/web test

          pnpm qa:phase1

      # Playwright is a devDependency, but browsers are not always preinstalled on CI runners.
      - name: Install Playwright browsers (chromium)
        run: pnpm exec playwright install --with-deps chromium

      - name: Workshop smoke (local serve)
        run: pnpm qa:workshop -- --serve
